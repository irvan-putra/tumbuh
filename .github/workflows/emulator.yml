name: tumbuh emulator smoke test (synthetic data)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag (e.g. v0.1.0). When set, tests that published APK instead of a debug build."
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew && ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on an emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash ci/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tumbuh-emulator-screenshots
          path: ci/shots/*
          if-no-files-found: warn
          retention-days: 7
