name: Seal signing continuity for repository consolidation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyNaCl==1.6.0
      - name: Seal only Tumbuh signing values to destination Actions key
        env:
          TUMBUH_KEYSTORE_B64: ${{ secrets.TUMBUH_KEYSTORE_B64 }}
          TUMBUH_KEY_ALIAS: ${{ secrets.TUMBUH_KEY_ALIAS }}
          TUMBUH_KEY_PASSWORD: ${{ secrets.TUMBUH_KEY_PASSWORD }}
          TUMBUH_STORE_PASSWORD: ${{ secrets.TUMBUH_STORE_PASSWORD }}
        run: |
          python - <<'PYCODE'
          import os,json,base64
          from nacl.public import PublicKey,SealedBox
          from nacl.encoding import Base64Encoder
          key=PublicKey('PcdsIzYo2QkfAe2LP+sgZ5hyJnqIPFfEgUaJyNtRPjI=',encoder=Base64Encoder)
          names=['TUMBUH_KEYSTORE_B64','TUMBUH_KEY_ALIAS','TUMBUH_KEY_PASSWORD','TUMBUH_STORE_PASSWORD']
          assert all(os.environ.get(n) for n in names)
          sealed={n:base64.b64encode(SealedBox(key).encrypt(os.environ[n].encode())).decode() for n in names}
          open('destination-sealed.json','w').write(json.dumps(sealed))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: destination-sealed-signing
          path: destination-sealed.json
          retention-days: 1
