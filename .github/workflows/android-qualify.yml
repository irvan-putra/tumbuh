name: tumbuh qualification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: tumbuh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    defaults:
      run:
        working-directory: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Assert package ID, version and no permissions
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name 'tumbuh-v0.2.2-debug.apk' -type f | head -1)
          test -n "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.vanipy.tumbuh' versionCode='5' versionName='0.2.2'"
          if "$AAPT" dump permissions "$APK" | grep -q 'uses-permission'; then echo "unexpected permission"; "$AAPT" dump permissions "$APK"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: tumbuh-qualification-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/tests/testDebugUnitTest/**
            android/app/build/widget-snapshots/*.png
          if-no-files-found: warn
          retention-days: 5
